name: Deploy to GitHub Pages

# CD: build the WASM sim + the Vite app under the project-pages base (/transitstory/) and
# publish packages/app/dist to GitHub Pages. Runs on pushes to the default branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token + the OIDC id-token the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (wasm + app, Pages base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: build wasm (crates/sim-wasm -> packages/wasm-sim)
        run: wasm-pack build crates/sim-wasm --target bundler --out-dir ../../packages/wasm-sim

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: build app (project-pages base)
        run: pnpm --filter app build
        env:
          BASE_PATH: /transitstory/

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/app/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
